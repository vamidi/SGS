services:
  sgs:
    image: ghcr.io/vamidi/sgs:latest
    container_name: sgs
    build:
      context: . #this is required only for debug mode
    # Optional overrides, see .env.example. Without a .env file the defaults
    # baked into the image are used.
    env_file:
      - path: .env
        required: false
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./games:/app/www/storage/app/public/games
    ports:
      - 8030:80
      - 4430:443
    restart: unless-stopped
